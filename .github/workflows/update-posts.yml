name: Update Posts and Publications

on:
  schedule:
    - cron: "0 6,18 * * *"  # Runs at 06:00 and 18:00 UTC → 07:00/19:00 in winter, 08:00/20:00 in summer
  workflow_dispatch: # Allows manual triggering

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch full history for git operations

      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.13'

      # Install Python dependencies if required
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Run your update script
      - name: Run update_posts script
        run: python3 update_posts.py

      # Run your update script
      - name: Run update_publications script
        run: python3 update_publications.py
        env:
          ARXIV_CACHE_MARKER: ${{ runner.temp }}/arxiv-cache-used.txt

      - name: Notify cached arXiv metadata use
        if: ${{ always() }}
        run: |
          if test -f "$RUNNER_TEMP/arxiv-cache-used.txt"; then
            if test -n "$BUSSILAB_NOTIFY_TOKEN" && test -n "$BUSSILAB_NOTIFY_CHANNEL"; then
              bussilab notify \
                -c "$BUSSILAB_NOTIFY_CHANNEL" \
                --token "$BUSSILAB_NOTIFY_TOKEN" \
                --screenlog "$RUNNER_TEMP/arxiv-cache-used.txt" \
                -m "Publication update used cached arXiv metadata"
            else
              echo "Cached arXiv metadata was used, but Slack notification credentials are unavailable."
            fi
          fi
        env:
          BUSSILAB_NOTIFY_TOKEN: ${{ secrets.BUSSILAB_NOTIFY_TOKEN }}
          BUSSILAB_NOTIFY_CHANNEL: ${{ secrets.BUSSILAB_NOTIFY_CHANNEL }}

      # Configure Git for commit
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push Changes
        run: |
          # Check if there are changes to stash
          if [ -n "$(git status --porcelain)" ]; then
            echo "Stashing local changes..."
            git stash --include-untracked
            stash_created=true
          else
            echo "No local changes to stash."
            stash_created=false
          fi
          
          # Pull latest changes and rebase
          git pull --rebase origin master || git rebase --abort
          
          # Reapply stashed changes if any
          if [ "$stash_created" = true ]; then
            echo "Applying stashed changes..."
            git stash pop || echo "No stash entries to apply."
          fi
          
          # Stage, commit, and push changes
          git add _data/posts.yml
          git add _data/posts_preformatted_text.yml
          git add _data/publications.yml
          git add publications.csv

          if ! git diff --cached --quiet; then
            if test -n "$BUSSILAB_NOTIFY_TOKEN" && test -n "$BUSSILAB_NOTIFY_CHANNEL" ; then
              git diff --cached --quiet _data/publications.yml publications.csv ||
              bussilab notify -c $BUSSILAB_NOTIFY_CHANNEL --token $BUSSILAB_NOTIFY_TOKEN --screenlog <(git diff origin/master -- _data/publications.yml publications.csv) -m "Publications updated"
            fi
            # [skip ci] used here in case later we add a on: push for this job
            git commit -m "[skip ci] Automated update: $(date)"
            git push origin master
          else
            echo "No changes to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUSSILAB_NOTIFY_TOKEN: ${{ secrets.BUSSILAB_NOTIFY_TOKEN }}
          BUSSILAB_NOTIFY_CHANNEL: ${{ secrets.BUSSILAB_NOTIFY_CHANNEL }}
